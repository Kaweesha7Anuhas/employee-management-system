# ===================================================================
# 1. APPLICATION & SERVER CONFIGURATION
# ===================================================================
spring.application.name=employeemanagement
server.port=8080

# ===================================================================
# 2. MYSQL DATASOURCE CONFIGURATION
# ===================================================================
# JDBC URL format: jdbc:mysql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Replace with your actual local MySQL username and password
spring.datasource.username=root
spring.datasource.password=Anuhas1111

# ===================================================================
# 3. JPA & HIBERNATE CONFIGURATION
# ===================================================================
# Hibernate ddl-auto: 'update' modifies the schema to match your Java entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries executed by Hibernate in the terminal console
spring.jpa.show-sql=true

# Format the logged SQL queries with clean indentation for easy reading
spring.jpa.properties.hibernate.format_sql=true

# Explicitly declare the MySQL dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect